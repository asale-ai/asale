[package]
name = "asale"
version.workspace = true
edition.workspace = true
description = "asale desktop shell — thin Tauri webview over the asale daemon"
default-run = "asale"

[lib]
name = "asale_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# All business logic (native + server communication) lives in the daemon; the
# shell embeds and runs it in-process (or reuses an externally started one).
asale-daemon = { path = "../daemon" }
# Only for its shared HTTP clients: the release check must go through whatever
# proxy the user configured, exactly like every other outbound call asale makes.
asale-client-core = { path = "../core" }

reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-shell = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-window-state = "2"

[dev-dependencies]
# A stand-in for asale.ai in the download tests: the interesting behaviour is
# what happens when an address does not answer or answers short, and that needs
# a server that can be told to do exactly that.
axum.workspace = true

[features]
custom-protocol = ["tauri/custom-protocol"]
