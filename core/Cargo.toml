[package]
name = "asale-client-core"
version.workspace = true
edition.workspace = true
description = "asale desktop client core — wsrelay client, provider executor, device identity, local store (the daemon wraps this)"

[lib]
name = "asale_client_core"
path = "src/lib.rs"

[dependencies]
# The wsrelay wire contract, shared verbatim with asale-server.
asale-protocol.workspace = true
token-meter.workspace = true

anyhow.workspace = true
async-trait.workspace = true
base64.workspace = true
futures-util.workspace = true
rand.workspace = true
reqwest = { workspace = true, features = ["stream", "socks"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio.workspace = true
tracing.workspace = true
uuid.workspace = true

ed25519-dalek = { version = "2", features = ["rand_core"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "sqlite", "macros", "migrate"] }
thiserror = "1"
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
