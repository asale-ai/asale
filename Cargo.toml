# asale client workspace.
#
# The three crates used to be independent packages, each with its own
# `Cargo.lock` and its own `target/` (2.7 + 6.8 + 13 GB). That meant
# `asale-client-core` was compiled three times over, and the same dependency
# could resolve to three different versions in the three lockfiles — including
# for `asale-daemon`, which ships inside the Tauri shell.
#
# One workspace = one lockfile, one target dir, every shared dependency built
# once. Versions of the crates all three use live in `[workspace.dependencies]`
# so they can only ever be bumped together.

[workspace]
resolver = "2"
members = ["protocol", "core", "daemon", "cli", "src-tauri"]

[workspace.package]
version = "0.6.1"
edition = "2021"

[workspace.dependencies]
# The wsrelay wire contract. Lives *inside* this repo on purpose: it is the
# public half of the protocol, so anyone writing their own publisher has it,
# and this repo stays buildable on its own. asale-server depends on this path.
asale-protocol = { path = "protocol" }
# Provider usage parsing, shared with asale-server so the two read a vendor's
# report identically. Default features only: no tokenizer tables in the client.
#
# From crates.io, not from a path: this repository is built on its own by CI,
# with nothing beside it, so anything outside these directories is simply not
# there. asale-protocol above can be a path because it lives *inside* this repo,
# which is the whole reason it was put there.
token-meter = "0.1.0"

# The agent firewall — the scanners behind the Security page and the check the
# local proxy runs on every buy-side request.
#
# By git tag rather than crates.io: the crate is not published, and the reason
# `token-meter` is a version dependency (the build host receives this repository
# and nothing beside it) is satisfied by a git URL just as well. Pinned to a tag
# so a build is reproducible; bump it deliberately.
agent-firewall = { git = "https://github.com/asale-ai/agent-firewall", tag = "v0.2.0", default-features = false }

anyhow = "1"
async-trait = "0.1"
axum = "0.7"
base64 = "0.22"
futures-util = "0.3"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
