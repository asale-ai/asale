# Three-platform client packaging
#
# Tauri cannot cross-compile bundles (.dmg only on macOS, .msi/.exe only on Windows,
# .deb/.AppImage only on Linux), so each of the three jobs runs on its own runner.
#
# Packaging logic is not reimplemented here: every job calls scripts/package.sh (Windows
# calls scripts/package.ps1), so the validation rules, default targets and output paths
# all come from the same place as a local build — CI and local builds cannot drift apart.
# The only extra thing CI does is write the secrets into the two files the scripts read
# (./.env.package and ./asale-updater.key, both gitignored).
#
# macOS is not split into arm/intel: package.sh defaults to universal-apple-darwin, one
# bundle covers both, and the download page is written for a single universal .dmg.
#
# Every job also produces `asale-cli-<version>-<platform>.{tar.gz,zip}`: the `asale`
# command line plus the `asaled` service, neither of which links webkit/GTK. That archive
# is the whole install on a machine with no desktop — asaled serves the web UI itself — and
# it is what https://asale.ai/dl/install.sh downloads. Linux is x86_64 only for now; arm64
# boxes have to build it themselves with `./scripts/package.sh --cli-only`.
#
# Triggers: pushing a v* tag, or a manual workflow_dispatch.
#
# Must be configured in the repository (Settings → Secrets and variables → Actions):
#
#   Secrets (required)
#     ASALE_QUOTA_PUBKEY              Gateway quota authorization public key. Without it the
#                                     built client refuses to go on the market and sell.
#                                     See .env.package.example for the value.
#     TAURI_SIGNING_PRIVATE_KEY       Contents of asale-updater.key (updater signing key)
#
#   Secrets (optional)
#     TAURI_SIGNING_PRIVATE_KEY_PASSWORD   Passphrase set when that private key was generated
#     ASALE_OAUTH_CLIENT_ID_GEMINI         Without these two, Gemini login is disabled in the client
#     ASALE_OAUTH_CLIENT_SECRET_GEMINI
#     APPLE_CERTIFICATE / APPLE_CERTIFICATE_PASSWORD / APPLE_SIGNING_IDENTITY
#                                          Not set → the .app/.dmg is unsigned and Gatekeeper
#                                          blocks it on other machines ("is damaged and can't
#                                          be opened")
#     Notarization credentials, either group (signing without notarizing is still blocked
#     on macOS 10.15+):
#       APPLE_ID / APPLE_PASSWORD / APPLE_TEAM_ID
#                                          APPLE_PASSWORD is an app-specific password created
#                                          at appleid.apple.com, not the account password
#       APPLE_API_ISSUER / APPLE_API_KEY / APPLE_API_KEY_CONTENT
#                                          App Store Connect API Key — a better fit for CI: not
#                                          tied to a personal account, unaffected by 2FA, and
#                                          revocable on its own.
#                                          APPLE_API_KEY is the Key ID (10 chars),
#                                          APPLE_API_KEY_CONTENT is the full text of the .p8
#                                          file; this workflow writes it out to the
#                                          APPLE_API_KEY_PATH that tauri expects.
#                                          Do not configure both groups — tauri only uses one.
#     Windows Authenticode signing, via Azure Artifact Signing (formerly Trusted Signing).
#     Not configured → the installer trips SmartScreen's "unknown publisher" warning.
#     All six or none: with a partial set package.ps1 fails the job rather than quietly
#     shipping an unsigned installer.
#       AZURE_CLIENT_ID / AZURE_CLIENT_SECRET / AZURE_TENANT_ID
#                                          App Registration credentials; the registration
#                                          needs the certificate-profile signer role granted
#                                          on the signing account, or every sign call 403s.
#       (plus the three AZURE_ARTIFACT_SIGNING_* variables below — endpoint, account and
#        certificate profile are not secrets, so they live in Variables)
#
#   Variables (optional; left empty, the production defaults from .env.package.example are used)
#     ASALE_SERVER_API / ASALE_GATEWAY_API / ASALE_GATEWAY_WS / ASALE_PROXY_PORT
#     AZURE_ARTIFACT_SIGNING_ENDPOINT      Regional endpoint of the signing account,
#                                          e.g. https://wus2.codesigning.azure.net
#     AZURE_ARTIFACT_SIGNING_ACCOUNT       Signing account name
#     AZURE_ARTIFACT_SIGNING_CERTIFICATE_PROFILE
#                                          Certificate profile name inside that account

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      sign:
        description: "Sign the artifacts for the updater (off = auto-update won't work; trial builds only)"
        type: boolean
        default: true
      release:
        description: "Create a draft Release with the artifacts attached after the build"
        type: boolean
        default: false

permissions:
  contents: write # needed to create the Release

env:
  # On macOS package.sh points rustup at rsproxy.cn by default (set up for networks in
  # mainland China). Runners are outside, where the official source is faster — override.
  RUSTUP_DIST_SERVER: https://static.rust-lang.org
  RUSTUP_UPDATE_ROOT: https://static.rust-lang.org/rustup
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      # If one platform breaks, the other two still produce bundles — at release time you
      # can at least ship what built.
      fail-fast: false
      matrix:
        include:
          - label: macOS (universal)
            os: macos-14
            artifact: asale-macos-universal
            # package.sh defaults to --universal on Darwin; output lands under target/<triple>/.
            bundle: target/universal-apple-darwin/release/bundle
          - label: Windows (x64)
            os: windows-latest
            artifact: asale-windows-x64
            bundle: target/release/bundle
          - label: Linux (x64)
            # Pinned to 22.04: the glibc floor of the artifacts is set by the build machine,
            # and bundles built on 24.04 fail to start on Debian 12 / Ubuntu 22.04 because
            # their glibc requirement is too new.
            os: ubuntu-22.04
            artifact: asale-linux-x64
            bundle: target/release/bundle

    steps:
      # The actions below are pinned to the major versions running on the node24 runtime:
      # the v4 series runs node20, which runners no longer provide — it is force-downgraded
      # and emits a deprecation warning on every run.
      - uses: actions/checkout@v5

      # v6 is the first version that officially supports installing pnpm 11 (v4/v5 fail to
      # resolve it), so version is pinned to 11 here.
      - uses: pnpm/action-setup@v6
        with:
          # package.json has no packageManager field, so the version has to be pinned here.
          # pnpm-workspace.yaml uses onlyBuiltDependencies (pnpm 10+ only).
          version: 11

      # From v5 on, caching turns on automatically when package.json has a packageManager
      # field; cache/cache-dependency-path are given explicitly here, same behavior.
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          # A single key shared by three platforms makes them clobber each other — split per job.
          key: ${{ matrix.artifact }}

      # Tauri v2 links against webkit2gtk-4.1 on Linux; without it cargo build fails at the
      # pkg-config stage. package.sh catches this earlier and prints this same package list.
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      # Both scripts read their configuration from files (an installed app has no shell
      # environment, so these values must be baked into the binary at compile time), so the
      # secrets are written out to those files first. Windows runners have bash too.
      - name: Write .env.package / updater private key
        shell: bash
        env:
          QUOTA_PUBKEY: ${{ secrets.ASALE_QUOTA_PUBKEY }}
          SERVER_API: ${{ vars.ASALE_SERVER_API }}
          GATEWAY_API: ${{ vars.ASALE_GATEWAY_API }}
          GATEWAY_WS: ${{ vars.ASALE_GATEWAY_WS }}
          PROXY_PORT: ${{ vars.ASALE_PROXY_PORT }}
          KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          GEMINI_ID: ${{ secrets.ASALE_OAUTH_CLIENT_ID_GEMINI }}
          GEMINI_SECRET: ${{ secrets.ASALE_OAUTH_CLIENT_SECRET_GEMINI }}
          UPDATER_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          # Code signing / notarization certificates. Deliberately defined only in this step
          # and forwarded selectively below (see the note in run:) — they must not go into
          # job-level env.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
          # Windows Authenticode via Azure Artifact Signing. Only the three credentials are
          # secrets; endpoint/account/profile are names, kept as Variables.
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_ARTIFACT_SIGNING_ENDPOINT: ${{ vars.AZURE_ARTIFACT_SIGNING_ENDPOINT }}
          AZURE_ARTIFACT_SIGNING_ACCOUNT: ${{ vars.AZURE_ARTIFACT_SIGNING_ACCOUNT }}
          AZURE_ARTIFACT_SIGNING_CERTIFICATE_PROFILE: ${{ vars.AZURE_ARTIFACT_SIGNING_CERTIFICATE_PROFILE }}
          # Mind the evaluation order: GitHub's && / || return an operand, not a boolean, so
          # `A && inputs.sign || true` swallows sign=false via the `|| true`.
          SIGN: ${{ github.event_name != 'workflow_dispatch' || inputs.sign }}
        run: |
          set -euo pipefail

          # The script checks this too, but by then it would first try to SSH to the server
          # to fetch the public key (there is no private key in CI — a wasted timeout), so
          # fail here first.
          if [[ -z "$QUOTA_PUBKEY" ]]; then
            echo "::error::secret ASALE_QUOTA_PUBKEY is empty. Without it the built client refuses to sell" \
                 "(it cannot verify the gateway authorization, which would mean handing subscription quota" \
                 "to anyone claiming to be the gateway). Value: the 'quota pubkey' line in the gateway startup log"
            exit 1
          fi

          {
            echo "ASALE_QUOTA_PUBKEY=$QUOTA_PUBKEY"
            echo "ASALE_SERVER_API=${SERVER_API:-https://api.asale.ai}"
            echo "ASALE_GATEWAY_API=${GATEWAY_API:-https://gw.asale.ai}"
            echo "ASALE_GATEWAY_WS=${GATEWAY_WS:-wss://gw.asale.ai/v1/ws}"
            echo "ASALE_PROXY_PORT=${PROXY_PORT:-9787}"
            echo "TAURI_SIGNING_PRIVATE_KEY_PASSWORD=$KEY_PASSWORD"
            # package.sh does `set -a; . ./.env.package`, so variables written here get exported and
            # the daemon's option_env! can pick them up at compile time. Using if rather than
            # `[[ ]] && echo`: the latter returns 1 when the condition is false, and as the
            # last statement of a block set -e would treat that as a failure.
            if [[ -n "$GEMINI_ID" ]]; then
              echo "ASALE_OAUTH_CLIENT_ID_GEMINI=$GEMINI_ID"
            fi
            if [[ -n "$GEMINI_SECRET" ]]; then
              echo "ASALE_OAUTH_CLIENT_SECRET_GEMINI=$GEMINI_SECRET"
            fi
          } > .env.package

          if [[ "$SIGN" == "true" ]]; then
            if [[ -z "$UPDATER_KEY" ]]; then
              echo "::error::secret TAURI_SIGNING_PRIVATE_KEY is empty but packaging requires signing." \
                   "createUpdaterArtifacts=true in tauri.conf.json makes the build fail outright;" \
                   "for a manual trial run, turn the sign input off."
              exit 1
            fi
            printf '%s' "$UPDATER_KEY" > asale-updater.key
          else
            echo "::warning::sign=false: artifacts carry no .sig, auto-update won't work — local verification only"
          fi

          # Code signing certificates: forward only the **non-empty** ones to later steps.
          # `env: X: ${{ secrets.X }}` yields "defined but empty" when the secret is unset, not
          # undefined; tauri checks whether the variable exists, so it would run security import /
          # signtool with an empty certificate and fail (on macOS: SecKeychainItemImport: One or
          # more parameters ... were not valid, surfacing as failed codesign application instead
          # of the "skip signing" we want).
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY \
                      APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID \
                      APPLE_API_ISSUER APPLE_API_KEY \
                      AZURE_CLIENT_ID AZURE_CLIENT_SECRET AZURE_TENANT_ID \
                      AZURE_ARTIFACT_SIGNING_ENDPOINT AZURE_ARTIFACT_SIGNING_ACCOUNT \
                      AZURE_ARTIFACT_SIGNING_CERTIFICATE_PROFILE; do
            value="${!name}"
            [[ -n "$value" ]] || continue
            # Heredoc form: for a multi-line base64 certificate, `NAME=value` would corrupt $GITHUB_ENV.
            printf '%s<<__ASALE_EOF__\n%s\n__ASALE_EOF__\n' "$name" "$value" >> "$GITHUB_ENV"
          done

          # App Store Connect API Key for notarization: tauri wants a file path
          # (APPLE_API_KEY_PATH) but a secret can only hold content, so write it to disk here.
          # The filename follows the notarytool convention of embedding the Key ID.
          # Written only on the macOS runner: the other two platforms don't need it, no reason
          # to spread the private key across disks.
          if [[ "$RUNNER_OS" == "macOS" && -n "$APPLE_API_KEY_CONTENT" ]]; then
            if [[ -z "$APPLE_API_KEY" || -z "$APPLE_API_ISSUER" ]]; then
              echo "::error::APPLE_API_KEY_CONTENT is set but APPLE_API_KEY (Key ID) or" \
                   "APPLE_API_ISSUER (Issuer UUID) is missing; notarization needs all three."
              exit 1
            fi
            key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY}.p8"
            printf '%s\n' "$APPLE_API_KEY_CONTENT" > "$key_path"
            chmod 600 "$key_path"
            echo "APPLE_API_KEY_PATH=$key_path" >> "$GITHUB_ENV"
          fi

      # Arguments are kept on one line: when not signing, the expression evaluates to an
      # empty string, and a line continuation would leave a dangling continuation character
      # (pwsh's ` is especially prone to parse errors from this).
      - name: Package (macOS / Linux)
        if: runner.os != 'Windows'
        run: ./scripts/package.sh ${{ (github.event_name == 'workflow_dispatch' && !inputs.sign) && '--no-sign' || '' }}

      # Authenticode signing tooling. Only needed when the Azure credentials are actually
      # configured — the previous step wrote them to $GITHUB_ENV only if non-empty, so this
      # `env.` check doubles as "is Windows signing set up at all".
      #
      # artifact-signing-cli (the renamed trusted-signing-cli) drives signtool with
      # Microsoft's signing dlib, which it downloads from NuGet on first run and which needs
      # a .NET runtime. signtool itself and the Azure CLI are located by package.ps1 — the
      # tool's built-in defaults hardcode one specific Windows SDK version.
      #
      # cargo install compiles from source (~2-3 min, not covered by rust-cache). Version is
      # pinned so a release build cannot change signing behavior on its own.
      - name: Windows signing tooling
        if: runner.os == 'Windows' && env.AZURE_CLIENT_ID != ''
        shell: pwsh
        run: |
          cargo install artifact-signing-cli --version ^0.11 --locked

      # v5 already runs on node24; setup-dotnet is only here for the signing dlib.
      - uses: actions/setup-dotnet@v5
        if: runner.os == 'Windows' && env.AZURE_CLIENT_ID != ''
        with:
          dotnet-version: "8.0.x"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: pwsh scripts/package.ps1 ${{ (github.event_name == 'workflow_dispatch' && !inputs.sign) && '-NoSign' || '' }}

      # Signing configured but the installers came out unsigned is the one failure mode that
      # looks green all the way to the download page, so assert it here rather than trusting
      # that the signCommand ran.
      # Skipped on a sign=false trial run: package.ps1 treats -NoSign as "sign nothing", so
      # there would be no signature to verify.
      - name: Verify Authenticode signature
        if: runner.os == 'Windows' && env.AZURE_CLIENT_ID != '' && (github.event_name != 'workflow_dispatch' || inputs.sign)
        shell: pwsh
        run: |
          $files = @(Get-ChildItem "${{ matrix.bundle }}" -Recurse -Include *.msi, *-setup.exe)
          if (-not $files) { throw "no installers found under ${{ matrix.bundle }}" }
          $bad = @()
          foreach ($f in $files) {
            $sig = Get-AuthenticodeSignature $f.FullName
            Write-Host ("{0,-12} {1}" -f $sig.Status, $f.Name)
            if ($sig.Status -ne "Valid") { $bad += "$($f.Name): $($sig.Status) — $($sig.StatusMessage)" }
          }
          if ($bad) { throw "Authenticode verification failed:`n$($bad -join "`n")" }

      # Artifacts are scattered across bundle/ subdirectories (dmg/, nsis/, deb/…); flatten
      # them into one directory so the download is ready to drop onto the download site.
      - name: Collect artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          find "${{ matrix.bundle }}" -type f \( \
              -name '*.dmg' -o -name '*.app.tar.gz' \
              -o -name '*.msi' -o -name '*-setup.exe' -o -name '*.nsis.zip' \
              -o -name '*.deb' -o -name '*.AppImage' -o -name '*.rpm' \
              -o -name '*.sig' \
              -o -name 'asale-cli-*.tar.gz' -o -name 'asale-cli-*.zip' \) \
            -exec cp {} artifacts/ \;
          ls -lh artifacts/
          # Zero files = packaging failed silently (e.g. only a bare executable came out).
          # Don't let the job pass green.
          [[ -n "$(ls -A artifacts/)" ]] || { echo "::error::no installer artifacts were produced"; exit 1; }

      - uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 30

  release:
    name: draft Release
    needs: build
    # Always created for tag triggers; a manual run has to tick release explicitly.
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v7
        with:
          path: dl
          merge-multiple: true # flatten all three platforms into dl/

      - name: Create draft Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ls -lh dl/

          tag="${GITHUB_REF_NAME}"
          # A manual run has no tag; build one from the version in tauri.conf.json.
          if [[ "$GITHUB_REF_TYPE" != "tag" ]]; then
            v="$(node -p "require('./src-tauri/tauri.conf.json').version")"
            tag="v${v}-${GITHUB_RUN_NUMBER}"
          fi

          # Draft, not a published release: install the artifacts and verify them yourself
          # before publishing by hand.
          gh release create "$tag" dl/* \
            --draft \
            --title "Asale client $tag" \
            --notes "Installers for all three platforms, built by the release workflow.

          Before publishing, confirm:
          - the macOS .dmg is signed and notarized (otherwise other machines report it as damaged)
          - the Windows installer is Authenticode-signed — the build asserts this when the
            Azure credentials are configured, but on a fresh Windows machine also check that
            \`Get-AuthenticodeSignature\` reports Valid and that SmartScreen stays quiet
            (a brand-new certificate has no reputation yet and can still warn for a while)
          - every bundle has a matching .sig next to it (required for auto-update)
          - install once and verify login and going on the market, then publish manually"
