[package]
name = "asale-protocol"
version = "0.7.7"
edition = "2021"
description = "asale wsrelay wire contract — shared verbatim by asale-server and the client. Pure serde: no tokio, no axum, no sqlx."

[lib]
name = "asale_protocol"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
